<!DOCTYPE html>
<html>
<head>
    <title> Personal Website</title>

    <style>
        body {

            background-color: #fff4cc;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: auto;
            padding: 25px;
            background-color: white;
            /* Blue border */
            border: 3px solid #e879a9;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .content {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .photo {
            /* Soft blue for photo section */
            background-color: #ffe3ef;
            padding: 20px;
            width: 40%;
            border-radius: 10px;
        }

        .info {
            /* Light red/pinkish touch for info section */
            background-color: #fff1b8;
            padding: 20px;
            width: 40%;
            border-radius: 10px;
            text-align: left;
        }

        .contact {
            /* Deep red for contact section */
            background-color: #e879a9;
            color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        h1 {
            color: #0d47a1;
        }

        h2 {
            color: #1565c0;
        }

        .info h2 {
            color: #c62828;
        }

        .contact h2 {
            color: white;
        }

        img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1976d2;
        }

        a {
            color: #ffeb3b;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Welcome To 
    Sohaymah's Website</h1>

    <div class="container">

        <div class="content">

            <div class="photo">
                <h2>My Picture</h2>
                <img src="https://drop.hammel.in/ios/download/faf6779c-02b0-43bd-bd17-cf53d484bb07.jpeg" alt="sahm">
            </div>

            <div class="info">
                <h2>About Me</h2>
                <p><strong>Name:</strong> Sohaymah</p>
                <p><strong>Age:</strong> 20</p>
                <p><strong>Faculty:</strong> Computer Science</p>
                <p><strong>Major:</strong> Software Engineering</p>
                <p><strong>Interests:</strong> Programming & Reading</p>
            </div>

        </div>

        <div class="contact">
            <h2>Get In Touch</h2>
            <!-- Working Link opening in a new tab -->
            <p><strong>Personal Link:</strong> <a href="https://www.google.com" target="_blank">Visit My Profile</a></p>
            <p><strong>Email:</strong> sahm@example.com</p>
        </div>

    </div>

</body>
</html>
